<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>Meatshop - Đăng nhập</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>

    <div class="main">
      <div class="navbar">
        <div class="icon">
          <h2 class="logo">MeatShop</h2>
        </div>
        </div>

      <div class="content">
        <h1>Log In &<br /><span>Experience</span></h1>
        <p class="bar">
          Sign in now to buy the product<br />And have the best experience<br />We
          will bring you the best experience<br />You do not have an account,
          register now
        </p>
        <div class="form">
          <input type="email" id="email" placeholder="Enter Email Here" />
          <input
            type="password"
            id="password"
            placeholder="Enter Password Here"
          />
          <button class="btn" id="loginBtn">Login</button>

          <p class="link">
            Don't have an account
            <br />
            <a href="register.html">Sign up here</a> 
          </p>
          <p class="liw">Login with</p>

          <div class="icon">
            <a href="#"> <ion-icon name="logo-facebook"></ion-icon></a>
            <a href="#"> <ion-icon name="logo-instagram"></ion-icon></a>
            <a href="#"> <ion-icon name="logo-twitter"></ion-icon></a>
            <a href="#"> <ion-icon name="logo-google"></ion-icon></a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
