<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #2c3e50; font-family: sans-serif; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Panel</h2>
        <input type="text" id="username" placeholder="Tài khoản (ví dụ: newadmin)">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="handleLogin()">ĐĂNG NHẬP</button>
        <p id="msg" style="color: red; margin-top: 10px;"></p>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>
