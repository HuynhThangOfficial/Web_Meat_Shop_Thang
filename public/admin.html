<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; background: #f4f7f6; }
        /* Sidebar */
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; position: fixed; }
        .sidebar h2 { text-align: center; padding: 20px 0; border-bottom: 1px solid #34495e; margin: 0; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar a { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; cursor: pointer; }
        .sidebar a:hover, .sidebar a.active { background: #1abc9c; color: white; }
        /* Main */
        .main { margin-left: 250px; width: 100%; padding: 20px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-red { background: #e74c3c; }
        .btn-blue { background: #3498db; }
        .btn-green { background: #27ae60; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #ecf0f1; }
        .status-select { padding: 5px; border-radius: 4px; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; width: 400px; border-radius: 8px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 95%; padding: 8px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MeatShop Admin</h2>
        <ul>
            <li><a onclick="renderDashboard()" id="nav-dash">Dashboard</a></li>
            <li><a onclick="renderProducts()" id="nav-prod">Sản Phẩm</a></li>
            <li><a onclick="renderOrders()" id="nav-order">Đơn Hàng</a></li>
            <li><a onclick="renderUsers()" id="nav-user">Khách Hàng</a></li>
        </ul>
    </div>

    <div class="main">
        <div class="header">
            <h2 id="page-title">Tổng Quan</h2>
            <button class="btn btn-red" onclick="handleLogout()">Đăng Xuất</button>
        </div>
        <div id="content">Loading...</div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Thêm Sản Phẩm</h3>
            <form id="productForm">
                <input type="hidden" id="prodId">
                <div class="form-group"><label>Tên:</label><input id="prodName" required></div>
                <div class="form-group"><label>Giá:</label><input id="prodPrice" type="number" required></div>
                <div class="form-group"><label>Kho:</label><input id="prodStock" type="number" required></div>
                <div class="form-group"><label>Ảnh (URL):</label><input id="prodImage"></div>
                <div class="form-group"><label>Mô tả:</label><textarea id="prodDesc"></textarea></div>
                <div style="text-align: right; margin-top: 15px;">
                    <button type="button" class="btn btn-red" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-blue">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
